name: Build ae-compat for Termux Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Add ae-compat crate
        run: |
          # O crate ja existe em crates/ae-compat do repo
          # so vamos garantir que ele eh compilado
          echo "Crate ae-compat ja esta no repo"

      - name: Build effectcraft-ae-compat
        run: |
          cargo build --release -p effectcraft-ae-compat --features aep,aepx,jsx --target aarch64-linux-android

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: effectcraft-ae-compat-android
          path: target/aarch64-linux-android/release/effectcraft-ae-compat